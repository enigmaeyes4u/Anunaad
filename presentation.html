    let current = 0;

    function renderSlide() {
      const slide = slides[current];
      const box = document.getElementById('slideBox');
      const content = document.getElementById('slideContent');
      const indicator = document.getElementById('slideIndicator');

      if (slide.dark) {
        box.classList.remove('bg-[#FDFBF7]', 'text-[#1C1B19]');
        box.classList.add('bg-[#1C1B19]', 'text-white');
      } else {
        box.classList.remove('bg-[#1C1B19]', 'text-white');
        box.classList.add('bg-[#FDFBF7]', 'text-[#1C1B19]');
      }

      content.innerHTML = slide.html;
      indicator.innerText = `${current + 1} / ${slides.length}`;
    }

    function nextSlide() {
      if (current < slides.length - 1) {
        current++;
        renderSlide();
      }
    }

    function prevSlide() {
      if (current > 0) {
        current--;
        renderSlide();
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        prevSlide();
      } else if (e.key === 'f' || e.key === 'F') {
        toggleFullScreen();
      }
    });

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    // Init
    renderSlide();
  </script>
